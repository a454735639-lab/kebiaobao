name: Kebiaobao
options:
  bundleIdPrefix: com.minis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # runner 为 Xcode 15.4，必须写旧格式（77 = Xcode 16，打不开）
  objectVersion: 56
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.9.4"
    # CURRENT_PROJECT_VERSION 由 CI 用 GitHub run_number 覆盖，保证每次构建递增
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Kebiaobao:
    type: application
    platform: iOS
    sources:
      - path: Kebiaobao
        excludes:
          - "Info.plist"
          - "Resources"
      # 内置节假日数据：显式声明为资源，保证打进 bundle
      - path: Kebiaobao/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Kebiaobao
        PRODUCT_BUNDLE_IDENTIFIER: com.minis.kebiaobao
        INFOPLIST_FILE: Kebiaobao/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"

schemes:
  Kebiaobao:
    build:
      targets:
        Kebiaobao: all
    run:
      config: Debug
    archive:
      config: Release
